name: Deploy to GitHub Pages

on:
  push:
    branches:
      - github-vue

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        working-directory: workspace/vue/geminon-spaceman
        run: |
          npm install
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # This must point exactly to where 'npm run build' puts the files
          path: 'workspace/vue/geminon-spaceman/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
